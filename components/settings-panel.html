<!-- components/settings-panel.html — floating traffic / rendering settings. -->
<section class="panel" id="settingsPanel" hidden aria-label="Scene settings">
  <button class="closepanel" id="closeSettings" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
  <div class="row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 10 2-5h10l2 5M4 10h16v8H4ZM6 18v2M18 18v2M7 13h2M15 13h2"/></svg>
    <input id="traffic" type="range" min="0" max="100" value="90" aria-label="Traffic density">
  </div>
  <div class="row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>
    <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" aria-label="Animation speed">
  </div>
  <div class="row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4M8 21h8"/></svg>
    <div class="choices" id="quality" role="group" aria-label="Rendering detail">
      <button data-quality="low" aria-label="Light rendering detail" title="Light · Best for older PCs"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button data-quality="medium" class="active" aria-label="Balanced rendering detail" title="Balanced · Adaptive resolution and shadows"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M12 8v8M8 12h8"/></svg></button>
      <button data-quality="high" aria-label="High rendering detail" title="High · Sharper resolution and shadows"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></button>
    </div>
  </div>
  <div class="row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="5"/><path d="m15 5 3 3-4 2"/></svg>
    <input class="switch" id="autoRotate" type="checkbox" aria-label="Slow automatic camera orbit">
  </div>
  <div class="row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="m12 7-3 6 4 3-2 6M12 7l3 5 4 1M9 13l-3 7M12 8l-5 2"/></svg>
    <input class="switch" id="movingPeople" type="checkbox" checked aria-label="Walking pedestrians">
  </div>
  <p id="performanceStatus" class="performance-status" role="status">Adaptive rendering · 60 FPS target</p>
</section>
